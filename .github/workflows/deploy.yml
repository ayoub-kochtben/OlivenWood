name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vente-project/frontend-angular/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vente-project/frontend-angular

      - name: Build
        run: npm run build -- --base-href /OlivenWood/
        working-directory: vente-project/frontend-angular

      - name: SPA fallback (404.html)
        run: cp dist/vente-frontend/index.html dist/vente-frontend/404.html
        working-directory: vente-project/frontend-angular

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vente-project/frontend-angular/dist/vente-frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
