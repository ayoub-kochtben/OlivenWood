# ===== Nom de l'application =====
spring.application.name=vente-backend

# ===== Connexion MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vente_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== Serveur =====
server.port=${PORT:8080}
server.servlet.context-path=/
# ===== CORS =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# ===== Admin =====
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:changeme}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}