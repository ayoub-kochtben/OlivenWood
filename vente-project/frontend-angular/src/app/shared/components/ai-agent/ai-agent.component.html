<div class="ai-widget">
  <button class="ai-toggle" (click)="toggle()">🤖</button>
  <div class="ai-chat" *ngIf="ouvert">
    <div class="ai-header">{{ 'AI_AGENT.TITLE' | translate }}</div>
    <div class="ai-body">
      <div *ngFor="let m of messages" [class.me]="m.deMoi" class="ai-message">
        {{ m.texte }}
      </div>
    </div>
    <div class="ai-footer">
      <input [(ngModel)]="saisie" (keyup.enter)="envoyer()" [placeholder]="'AI_AGENT.PLACEHOLDER' | translate">
      <button (click)="envoyer()">➤</button>
    </div>
  </div>
</div>
