<app-admin-header></app-admin-header>

<section class="admin-login-section">
  <div class="admin-login-card">
    <h1>Espace administrateur</h1>
    <p class="erreur" *ngIf="erreur">{{ erreur }}</p>
    <form (ngSubmit)="seConnecter()">
      <input type="text" placeholder="Nom d'utilisateur" [(ngModel)]="username" name="username" required>
      <input type="password" placeholder="Mot de passe" [(ngModel)]="password" name="password" required>
      <button type="submit" class="btn-primary" [disabled]="chargement">
        {{ chargement ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</section>
