<section class="container page-section">
  <h1 class="section-title">Toutes nos catégories</h1>
  <div class="category-grid">
    <a *ngFor="let c of categories" [routerLink]="['/categories', c.id]" class="category-card">
      <img [src]="c.imageUrl" [alt]="c.nom">
      <span>{{ c.nom }}</span>
    </a>
  </div>
</section>
